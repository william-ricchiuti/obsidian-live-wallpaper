name: Release

# Publishes to npm when a version tag is pushed (e.g. `git tag v1.0.0 && git push --tags`).
# Requires an NPM_TOKEN secret with publish rights; without it the npm step is
# skipped and only the GitHub release is created. (`secrets` can't be used in a
# step `if:`, which made this file fail to parse; it is mapped to env instead.)

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package.json version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${pkg_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${pkg_version}"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      - name: Test
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm test

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
