  if (t >= 1) { __fadeActive = false; return; }
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0); // __fadeCanvas is in device pixels
  ctx.globalAlpha = 1 - t;
  ctx.drawImage(__fadeCanvas, 0, 0);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function invalidateStaticLayer() { staticLayerDirty = true; cachedHalos = null; }

// Background + cluster halos, painted onto #bg only when something changes.
function renderStaticLayer() {
  const g = bgCtx;
  g.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  g.fillStyle = cfg.background;
  g.fillRect(0, 0, innerWidth, innerHeight);
  drawBackgroundGradient(g);
  drawClusterHalos(g);
  staticLayerDirty = false;
  staticLayerLastBuild = performance.now();
}

function maybeRenderStaticLayer() {
  if (!staticLayerDirty) return;
  if (!simRunning || performance.now() - staticLayerLastBuild >= 500) renderStaticLayer();
}

function hexToRGB(h) {
  let cached = RGB_CACHE.get(h);
  if (cached) return cached;
  const n = parseInt(h.slice(1), 16);
  cached = [n >> 16 & 255, n >> 8 & 255, n & 255];
  RGB_CACHE.set(h, cached);
  return cached;
}

function rgba(r, g, b, a) {
  return `rgba(${r},${g},${b},${a})`;
}

function nodeColor(node) {
  return node.__color || cfg.accent;
}

function edgeColor(link) {
  return link.__color || cfg.accent;
}

function rankMap(values) {
  const counts = new Map();
  for (const v of values) if (v) counts.set(v, (counts.get(v) || 0) + 1);
  const m = new Map();
  Array.from(counts.entries()).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).forEach(([v], i) => m.set(v, i));
  return m;
}

function refreshDerivedVisuals() {
  palette = cfg.palette && cfg.palette !== 'auto' ? PALETTES[cfg.palette] || null : null;
  if (nodes.length === 0) {
    labelCandidates = [];
    return;
  }
  refreshAgeStats();
  tagRank = rankMap(nodes.filter(n => !n.ghost).map(n => n.tag));
  folderRank = rankMap(nodes.filter(n => !n.ghost).map(n => n.folder));
  const mode = cfg.nodeColorMode;
  const recencyDays = cfg.recencyDays || 7;

  for (let i = 0; i < nodes.length; i++) {
    const node = nodes[i];
    let color;
    if (mode === 'age') {
      const b = ageBucket(node);
      color = palette ? palette[b % palette.length] : AGE_PALETTE[b];
    } else if (mode === 'folder') {
      color = palette && node.folder ? palette[(folderRank.get(node.folder) || 0) % palette.length] : folderColor(node.folder);
    } else {
      color = (node.tag && cfg.tagColors[node.tag])
        || (palette && node.tag ? palette[(tagRank.get(node.tag) || 0) % palette.length] : null)
        || cfg.accent;
    }
    node.__color = color;
    node.__dim = mode === 'recency' && (node.ghost || nodeDays(node) >= recencyDays) ? 1 : 0;
    node.__shape = node.tag ? (tagRank.get(node.tag) || 0) % 4 : 0;
    // Breathing offset is always assigned (it used to be set only if breathing
    // was on at load, so enabling it later gave NaN and erased every glow).
    node.__breathOffset = (Math.abs(hashStr(node.id)) % 6283) / 1000;
    node.__labelText = truncateLabel(node.label || node.id, 28);
    node.__labelFontSize = Math.max(10, 11 + (node.importance || 0) * 5);
    if (!node.ghost && (node.importance || 0) >= sceneTuning.labelMinImportance) {
      ctx.font = `${node.__labelFontSize}px ${labelFontStack()}`;
      node.__labelWidth = ctx.measureText(node.__labelText).width;
    } else {
      node.__labelWidth = 0;
    }
  }

  for (let i = 0; i < links.length; i++) {
    const link = links[i];
    // Edges inherit the source node's resolved colour so colouring works for
    // tag, age, and folder modes alike.
    link.__color = sceneTuning.edgeColoringEnabled
      ? (link.source.__color || link.target.__color || cfg.accent)
      : cfg.accent;
  }

  if (cfg.labelSource === 'recent') {
    labelCandidates = nodes.filter(n => !n.ghost && n.mtime).sort((a, b) => b.mtime - a.mtime).slice(0, 60);
  } else {
    labelCandidates = nodes.filter(node => !node.ghost).sort((a, b) => (b.importance || 0) - (a.importance || 0));
  }
  sceneDirty = true;
  labelSpriteCache.clear();
}

function syncSharedPositions() {
  if (!simSharedEnabled || !simSharedPositions) return;
  for (let i = 0; i < nodes.length; i++) {
    const node = nodes[i];
    const x = simSharedPositions[i * 2];
    const y = simSharedPositions[i * 2 + 1];
    if (Number.isFinite(x)) node.x = x;
    if (Number.isFinite(y)) node.y = y;
  }
}

// ---------------------------------------------------------------------------
// Framing: map simulation coordinates onto the screen
// ---------------------------------------------------------------------------
// The layout lives in its own coordinate space. Framing fits it into a target
// rectangle (fill, centred, left or right third), honouring the safe area,
// zoom, offset and multi-monitor span. The transform eases toward its target
// so the graph doesn't jump while the simulation settles.
let framingDirty = true;
let framingLastCompute = 0;
let framingEpoch = 0;
const frame = { sx: 1, sy: 1, tx: 0, ty: 0, cx: 0, cy: 0, ready: false };
const frameTarget = { sx: 1, sy: 1, tx: 0, ty: 0, cx: 0, cy: 0 };
let framingRect = { x: 0, y: 0, w: 0, h: 0 };
let framingAnimating = false;

function percentileBounds(list) {
  // Sample for big graphs; 2nd–98th percentile so far-flung orphans don't
  // shrink the whole picture.
  const step = Math.max(1, Math.floor(list.length / 4000));
  const xs = [], ys = [];
  for (let i = 0; i < list.length; i += step) { xs.push(list[i].x); ys.push(list[i].y); }
  if (!xs.length) return null;
  xs.sort((a, b) => a - b); ys.sort((a, b) => a - b);
  const q = (arr, f) => arr[Math.min(arr.length - 1, Math.max(0, Math.floor(f * (arr.length - 1))))];
  const lo = xs.length > 40 ? 0.02 : 0, hi = xs.length > 40 ? 0.98 : 1;
  return { x0: q(xs, lo), x1: q(xs, hi), y0: q(ys, lo), y1: q(ys, hi) };
}

function computeFramingTarget() {
  framingLastCompute = performance.now();
  framingDirty = false;
  const sa = cfg.safeArea || {};
  const virtW = innerWidth * SPAN.count;
  const H = innerHeight;
  const left = (SPAN.index === 0 ? sa.left || 0 : 0);
  const right = (SPAN.index === SPAN.count - 1 ? sa.right || 0 : 0);
  // In span mode safe-area left/right apply to the outer edges of the set.
  const rx = left + virtW * 0.05;
  const ry = (sa.top || 0) + H * 0.075;
  const rw = Math.max(50, virtW - left - right - virtW * 0.1);
  const rh = Math.max(50, H - (sa.top || 0) - (sa.bottom || 0) - H * 0.15);
  framingRect = { x: rx - SPAN.index * innerWidth, y: ry, w: rw, h: rh };
  if (cfg.framing === 'none') {
    Object.assign(frameTarget, { sx: 1, sy: 1, tx: 0, ty: 0, cx: 0, cy: 0 });
    return;
  }
  const visible = [];
  for (const n of nodes) if (n.__renderable !== false && hasPoint(n)) visible.push(n);
  const b = percentileBounds(visible);
  if (!b) return;
  const gw = Math.max(1, b.x1 - b.x0), gh = Math.max(1, b.y1 - b.y0);
  let cx = rx + rw / 2, cy = ry + rh / 2, sx, sy;
  if (cfg.framing === 'fill') {
    sx = rw / gw; sy = rh / gh;
    // Allow some stretch to fill the screen, but not more than 1.6:1.
    const ratio = sx / sy;
    if (ratio > 1.6) sx = sy * 1.6;
    else if (ratio < 1 / 1.6) sy = sx * 1.6;
  } else if (cfg.framing === 'center') {
    sx = sy = Math.min(rw / gw, rh / gh) * 0.82;
  } else {
    sx = sy = Math.min((rw * 0.58) / gw, rh / gh);
    cx = rx + rw * (cfg.framing === 'left' ? 0.3 : 0.7);
  }
  // Small vaults: don't blow a handful of notes up across the whole screen.
  const MAX_SCALE = 2.2;
  if (sx > MAX_SCALE || sy > MAX_SCALE) { const f = MAX_SCALE / Math.max(sx, sy); sx *= f; sy *= f; }
  const z = cfg.zoom || 1;
  cx += (cfg.offsetX || 0) * rw * 0.5;
  cy += (cfg.offsetY || 0) * rh * 0.5;
  Object.assign(frameTarget, { sx: sx * z, sy: sy * z, cx: (b.x0 + b.x1) / 2, cy: (b.y0 + b.y1) / 2, tx: cx - SPAN.index * innerWidth, ty: cy });
}

function updateFraming() {
  const interval = simRunning ? 400 : 4000;
  if (framingDirty || performance.now() - framingLastCompute > interval || !frame.ready) computeFramingTarget();
  let moved = false;
  const k = !frame.ready || ONESHOT || SYNTHETIC_SIZE > 0 ? 1 : 0.18;
  for (const key of ['sx', 'sy', 'tx', 'ty', 'cx', 'cy']) {
    const d = frameTarget[key] - frame[key];
    if (Math.abs(d) > 1e-3 * Math.max(1, Math.abs(frameTarget[key]))) { frame[key] += d * k; moved = true; }
    else frame[key] = frameTarget[key];
  }
  frame.ready = true;
  framingAnimating = moved;
  if (moved) { framingEpoch++; invalidateStaticLayer(); }
}

// ---------------------------------------------------------------------------
// Per-frame positions
// ---------------------------------------------------------------------------
function assignDepthLayers() {
  const layers = Math.max(2, cfg.depthParallaxLayers || 3);
  const sorted = nodes.slice().sort((a, b) => (b.importance || 0) - (a.importance || 0));
  for (let i = 0; i < sorted.length; i++) {
    sorted[i].__depthLayer = Math.min(layers - 1, Math.floor((i / sorted.length) * layers));
  }
}

// Layer 0 = front (most important). Back layers drift more slowly and sit
// dimmer and smaller, which reads as depth.
function depthLayerParams(layer, totalLayers, strength) {
  const t = (layer || 0) / Math.max(1, (totalLayers || 3) - 1);
  return {
    drift: 1 - t * 0.6 * strength,
    alpha: 1 - t * 0.5 * strength,
    size: 1 - t * 0.25 * strength
  };
}

const __flow = [0, 0];
let __viewMinX = 0, __viewMaxX = 0, __viewMinY = 0, __viewMaxY = 0;
let buildFramePoints = function () {
  if (simSharedEnabled && simRunning) syncSharedPositions();
  updateFraming();
  const motion = sceneTuning.motion;
  const amp = motion.driftAmp * (activeTheme() ? 0 : 1);
  const tSec = motionTime() * motion.phaseSpeed * 0.9;
  const parallax = cfg.depthParallax && !activeTheme();
  const layers = Math.max(2, cfg.depthParallaxLayers || 3);
  const strength = cfg.depthParallaxStrength ?? 0.5;
  const fx = frame.sx, fy = frame.sy, ftx = frame.tx, fty = frame.ty, fcx = frame.cx, fcy = frame.cy;
  const MARGIN = 100;
  __viewMinX = -MARGIN; __viewMinY = -MARGIN; __viewMaxX = innerWidth + MARGIN; __viewMaxY = innerHeight + MARGIN;
  for (let i = 0; i < nodes.length; i++) {
    const node = nodes[i];
    node.__vFrame = -1;
    if (node.__renderable === false || !hasPoint(node)) {
      node.__hasPoint = false;
      node.__fx = NaN; node.__fy = NaN;
      continue;
    }
    node.__hasPoint = true;
    const bx = ftx + (node.x - fcx) * fx;
    const by = fty + (node.y - fcy) * fy;
    node.__bx = bx; node.__by = by;
    let a = amp * (0.4 + (node.importance || 0) * 0.8);
    if (parallax) {
      const p = depthLayerParams(node.__depthLayer, layers, strength);
      a *= p.drift;
      node.__depthAlpha = p.alpha; node.__depthSize = p.size;
    } else {
      node.__depthAlpha = 1; node.__depthSize = 1;
    }
    if (a > 0) {
      flowOffset(bx, by, tSec, __flow);
      node.__fx = bx + __flow[0] * a;
      node.__fy = by + __flow[1] * a;
    } else {
      node.__fx = bx; node.__fy = by;
    }
    if (node.__fx >= __viewMinX && node.__fx <= __viewMaxX && node.__fy >= __viewMinY && node.__fy <= __viewMaxY) node.__vFrame = tick;
  }
  __cullFrame = tick;
};

// Depth of field: precomputed centre and inverse half-diagonal.
let __dofCx = 0, __dofCy = 0, __dofInv = 1;
function prepareDof() {
  __dofCx = innerWidth / 2; __dofCy = innerHeight / 2;
  __dofInv = 2 / Math.sqrt(innerWidth * innerWidth + innerHeight * innerHeight);
}
function distFromCenterPoint(x, y) {
  const dx = x - __dofCx, dy = y - __dofCy;
  return Math.sqrt(dx * dx + dy * dy) * __dofInv;
}

function roundedRectPath(x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + w - radius, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
  ctx.lineTo(x + w, y + h - radius);
  ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  ctx.lineTo(x + radius, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
}

async function loadJson(pathname, options) {
  try {
    const response = await fetch(pathname, { cache: 'no-store', ...(options || {}) });
    if (!response.ok) return null;
    return await response.json();
  } catch {
    return null;
  }
}

async function loadCfg() {
  const prevRefreshMs = cfg.refreshMs;
  const prevCfg = cfg;
  let raw = null;
  if (SYNTHETIC_SIZE > 0 && SYNTHETIC_CFG) {
    raw = normalizeConfig(SYNTHETIC_CFG);
  } else {
    const data = await loadJson('/api/config');
    if (data) raw = normalizeConfig(data);
    else if (SYNTHETIC_SIZE === 0) console.warn('config API not available, using defaults');
  }
  if (raw) {
    __rawCfg = raw;
    const nextCfg = computeEffectiveConfig(raw);
    await ensureTheme(nextCfg.theme);
    if (__hasRendered && isBigVisualChange(prevCfg, nextCfg)) snapshotForFade();
    const layoutChanged = prevCfg.layout !== nextCfg.layout || prevCfg.clusterByTag !== nextCfg.clusterByTag;
    cfg = nextCfg;
    if (layoutChanged && nodes.length && SYNTHETIC_SIZE === 0) startSimulation(0.8);
    if (cfg.depthParallax && nodes.length) assignDepthLayers();
  }
  applyBackground();
  refreshSceneTuning();
  applyPostLayers();
  markConfigChanged();
  if (!eventSource && stateSyncTimer && prevRefreshMs !== cfg.refreshMs) {
    startStateSync();
  }
}

// Fetch canonical defaults once at boot so normalizeConfig never drifts.
(async () => {
  if (SYNTHETIC_SIZE > 0) return;
  const defaults = await loadJson('/api/defaults');
  if (defaults && isPlainObject(defaults)) Object.assign(DEFAULTS, defaults);
})();

function graphHash(graph) {
  return cfg.fastHash === false ? graphHashSlow(graph) : graphHashFast(graph);
}

function ensureSimWorker() {
  if (simWorker) return simWorker;
  try {
    simWorker = new Worker('/worker.js');
  } catch (e) {
    console.warn('sim worker failed to start:', e.message);
    simWorker = null;
    return null;
  }
  simWorker.onmessage = (e) => {
    const msg = e.data;
    if (!msg) return;
    if (msg.generation !== simGeneration) return; // stale tick from previous graph
    if (msg.type !== 'tick' && msg.type !== 'stopped') return;
    if (msg.buffer) {
      const buf = new Float32Array(msg.buffer);
      const len = Math.min(nodes.length, (msg.count | 0) || (buf.length >> 1));
      for (let i = 0; i < len; i++) {
        const node = nodes[i];
        const bx = buf[i * 2];
        const by = buf[i * 2 + 1];
        if (Number.isFinite(bx)) node.x = bx;
        if (Number.isFinite(by)) node.y = by;
      }
    }
    simAlpha = msg.alpha || 0;
    if (msg.type === 'stopped') {
      if (simSharedEnabled) syncSharedPositions();
      simRunning = false;
      simSharedEnabled = false;
      simSharedPositions = null;
      framingDirty = true;
      invalidateStaticLayer();
      sceneDirty = true;
      wake();
    }
  };
  simWorker.onerror = (err) => { console.warn('sim worker error:', err.message || err); };
  return simWorker;
}

// Starts (or warm-restarts) the layout. alpha < 1 keeps the existing layout
// and only lets it relax around what changed.
function startSimulation(alpha) {
  if (!nodes.length) return;
  if (ONESHOT) { settleSynchronously(alpha); return; }
  ensureSimWorker();
  if (!simWorker) { settleSynchronously(alpha); return; }
  simRunning = true;
  simAlpha = alpha;
  simGeneration += 1;
  simSharedEnabled = !!(window.crossOriginIsolated && typeof SharedArrayBuffer !== 'undefined');
  simSharedPositions = simSharedEnabled
    ? new Float32Array(new SharedArrayBuffer(Float32Array.BYTES_PER_ELEMENT * nodes.length * 2))
    : null;
  const workerNodes = new Array(nodes.length);
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    workerNodes[i] = { id: n.id, tag: n.tag || null, ghost: !!n.ghost, mtime: n.mtime || 0, r: n.r, x: n.x, y: n.y, vx: n.vx || 0, vy: n.vy || 0 };
  }
  const workerLinks = new Array(links.length);
  for (let i = 0; i < links.length; i++) {
    const l = links[i];
    workerLinks[i] = { source: typeof l.source === 'object' ? l.source.id : l.source, target: typeof l.target === 'object' ? l.target.id : l.target };
  }
  simWorker.postMessage({
    type: 'start',
    generation: simGeneration,
    nodes: workerNodes,
    links: workerLinks,
    clusterByTag: !!cfg.clusterByTag,
    layout: cfg.layout,
    alpha,
    width: innerWidth,
    height: innerHeight,
    now: Date.now(),
    sharedBuffer: simSharedPositions ? simSharedPositions.buffer : null,
    centerX: innerWidth / 2,
    centerY: innerHeight / 2
  });
  framingDirty = true;
  markConfigChanged();
  invalidateStaticLayer();
}

// Captures (oneshot, synthetic, export without a worker) settle the layout on
// the main thread with the same code the worker runs.
function settleSynchronously(alpha) {
  if (typeof d3 === 'undefined' || !nodes.length) return;
  const simNodes = nodes.map(n => ({ id: n.id, tag: n.tag || null, ghost: !!n.ghost, mtime: n.mtime || 0, r: n.r, x: n.x, y: n.y, vx: 0, vy: 0 }));
  const simLinks = links.map(l => ({ source: l.source.id || l.source, target: l.target.id || l.target }));
  const sim = LayoutCore.createSimulation(d3, simNodes, simLinks, {
    layout: cfg.layout, width: innerWidth, height: innerHeight, centerX: innerWidth / 2, centerY: innerHeight / 2,
    clusterByTag: !!cfg.clusterByTag, alpha: alpha || 1, now: Date.now()
  });
  LayoutCore.settle(sim, nodes.length > 2500 ? 120 : 300);
  for (let i = 0; i < nodes.length; i++) { nodes[i].x = simNodes[i].x; nodes[i].y = simNodes[i].y; }
  simRunning = false;
  simAlpha = 0;
  framingDirty = true;
  invalidateStaticLayer();
}

function topologyOf(graph) {
  // Ids, tags and links: what the layout depends on. mtime/label/folder
  // changes (e.g. editing a note's body) don't move anything.
  return graphHash({ nodes: graph.nodes, links: graph.links }) + ':' + (cfg.layout || 'force');
}

async function fetchGraph() {
  if (SYNTHETIC_SIZE > 0) return buildSyntheticGraph(SYNTHETIC_SIZE);
  try {
    // 'no-cache' revalidates with If-None-Match; an unchanged graph comes back
    // as a cached 304 and is skipped without re-parsing.
    const res = await fetch('graph.json', { cache: 'no-cache' });
    if (!res.ok) return null;
    const etag = res.headers.get('ETag') || '';
    if (etag && etag === lastGraphEtag && nodes.length) return 'unchanged';
    lastGraphEtag = etag;
    return await res.json();
  } catch (e) {
    return null;
  }
}

async function loadGraph() {
  try {
    const graph = await fetchGraph();
    if (graph === 'unchanged') return;
    if (!graph?.nodes || !graph?.links) return;

    const newIds = new Set(graph.nodes.map(node => node.id));
    detectNewNodes(newIds);
    const nextTopology = topologyOf(graph);
    const topologyChanged = nextTopology !== topologyHash;
    topologyHash = nextTopology;

    const previousNodes = new Map(nodes.map(node => [node.id, node]));
    let kept = 0;
    nodes = graph.nodes.map(node => {
      const previous = previousNodes.get(node.id);
      if (previous) {
        kept++;
        return Object.assign(previous, {
          tag: node.tag, tags: node.tags, ghost: node.ghost || false, label: node.label,
          mtime: node.mtime || 0, folder: node.folder
        });
      }
      const fresh = { ...node, ghost: node.ghost || false, vx: 0, vy: 0, __new: true };
      if (!finiteNumber(fresh.x)) { fresh.x = NaN; fresh.y = NaN; }
      return fresh;
    });
    for (let i = 0; i < nodes.length; i++) nodes[i].__index = i;

    const nodeById = new Map();
    for (let i = 0; i < nodes.length; i++) nodeById.set(nodes[i].id, nodes[i]);
    links = [];
    for (const l of graph.links) {
      const s = nodeById.get(typeof l.source === 'object' ? l.source.id : l.source);
      const t = nodeById.get(typeof l.target === 'object' ? l.target.id : l.target);
      if (s && t) links.push({ source: s, target: t });
    }

    // Seed new notes next to the notes they link to (or near the centre of
    // the layout), so they appear in place instead of flying in.
    const spread = Math.min(innerWidth, innerHeight) * 0.4;
    let seeded = 0;
    for (const n of nodes) {
      if (!n.__new) continue;
      let sx = 0, sy = 0, c = 0;
      for (const l of links) {
        const o = l.source === n ? l.target : l.target === n ? l.source : null;
        if (o && !o.__new && hasPoint(o)) { sx += o.x; sy += o.y; c++; }
      }
      if (c) { n.x = sx / c + (Math.random() - 0.5) * 20; n.y = sy / c + (Math.random() - 0.5) * 20; seeded++; }
    }
    for (const n of nodes) {
      if (n.__new && !hasPoint(n)) { n.x = innerWidth / 2 + (Math.random() - 0.5) * spread; n.y = innerHeight / 2 + (Math.random() - 0.5) * spread; }
      delete n.__new;
    }

    for (let i = 0; i < particlePool.length; i++) {
      const p = particlePool[i];
      if (p.active && (!newIds.has(p.link?.source?.id) || !newIds.has(p.link?.target?.id))) {
        p.active = false; p.link = null; activeParticleCount--;
      }
    }

    const degree = new Map();
    for (const link of links) {
      degree.set(link.source, (degree.get(link.source) || 0) + 1);
      degree.set(link.target, (degree.get(link.target) || 0) + 1);
    }
    let dMax = 1;
    for (const v of degree.values()) if (v > dMax) dMax = v;
    maxDeg = dMax;
    for (const node of nodes) {
      const degreeCount = degree.get(node) || 0;
      node.deg = degreeCount;
      node.r = node.ghost ? 1.5 + Math.sqrt(degreeCount) * 0.8 : 2.2 + Math.sqrt(degreeCount) * 1.45;
      node.importance = Math.min(1, degreeCount / maxDeg);
    }
    __rankValid = false;
    // Depth layers need importance, so they are assigned after it is known.
    assignDepthLayers();
    graphEpoch++;
    refreshAgeStats();
    refreshSceneTuning();
    if (cfg.overlay === 'stats') renderOverlay();

    if (SYNTHETIC_SIZE > 0) {
      // Pre-settle synthetic graphs with the real layout (small/medium), or a
      // cheap spiral for huge ones, so captures need no worker.
      if (SYNTHETIC_SIZE <= 3000) settleSynchronously(1);
      else spiralLayout();
      simRunning = false;
      simAlpha = 0;
      markConfigChanged();
      return;
    }
    if (topologyChanged) {
      // Warm restart when most notes already have positions: the layout only
      // relaxes around what changed instead of re-shuffling everything.
      const warm = kept > 0 && kept >= nodes.length * 0.8;
      startSimulation(warm ? 0.25 : 1);
    }
    sceneDirty = true;
    markConfigChanged();
  } catch (error) {
    console.warn('load failed:', error.message);
  }
}

function spiralLayout() {
  const cx = innerWidth / 2, cy = innerHeight / 2;
  const maxR = Math.min(innerWidth, innerHeight) * 0.42;
  const PHI = Math.PI * (3 - Math.sqrt(5));
  const ranks = LayoutCore.tagRanks(nodes).rank;
  const tagCount = Math.max(1, ranks.size);
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    const ti = ranks.get(n.tag || '') || 0;
    const a = (ti / tagCount) * Math.PI * 2;
    const radius = Math.sqrt(i / nodes.length) * maxR * 0.6;
    n.x = cx + Math.cos(a) * maxR * 0.28 + Math.cos(i * PHI) * radius;
    n.y = cy + Math.sin(a) * maxR * 0.28 + Math.sin(i * PHI) * radius;
  }
}

const flares = new Map(); // id -> { start (ms), duration (ms) }
let prevNodeIds = new Set();
function detectNewNodes(newIds) {
  if (prevNodeIds.size === 0) {
    prevNodeIds = newIds;
    return;
  }
  const now = performance.now();
  for (const id of newIds) {
    if (!prevNodeIds.has(id)) flares.set(id, { start: now, duration: 1500 });
  }
  for (const id of flares.keys()) {
    if (!newIds.has(id)) flares.delete(id);
  }
  prevNodeIds = newIds;
}

function getFlareIntensity(nodeId) {
  if (!sceneTuning.noteFlareEnabled || !flares.has(nodeId)) return 0;
  const flare = flares.get(nodeId);
  const age = performance.now() - flare.start;
  if (age > flare.duration) {
    flares.delete(nodeId);
    return 0;
  }
  const t = age / flare.duration;
  return t < 0.15 ? t / 0.15 : 1 - ((t - 0.15) / 0.85);
}

// ---------------------------------------------------------------------------
// Particles (edge flow) — time-based so speed doesn't depend on frame rate
// ---------------------------------------------------------------------------
let __lastParticleSpawn = 0;
function spawnParticles(now) {
  if (!sceneTuning.particlesEnabled || !links.length) return;
  const every = sceneTuning.motion.particleSpawnEvery * 16.67;
  if (now - __lastParticleSpawn < every) return;
  __lastParticleSpawn = now;
  const desired = Math.min(sceneTuning.particleCap, Math.floor(links.length * cfg.particleDensity * 0.7));
  if (activeParticleCount >= desired) return;
  const burst = Math.min(sceneTuning.motion.particleBurst, desired - activeParticleCount);
  let spawned = 0;
  for (let i = 0; i < particlePool.length && spawned < burst; i++) {
    const slot = particlePool[i];
    if (slot.active) continue;
    const link = links[Math.floor(Math.random() * links.length)];
    if (!link || link.source.__renderable === false || link.target.__renderable === false) continue;
    slot.active = true;
    slot.link = link;
    slot.t = 0;
    slot.speed = (0.003 + Math.random() * 0.004) * cfg.particleSpeed;
    slot.alpha = (0.28 + Math.random() * 0.35) * sceneTuning.motion.particleAlpha;
    slot.size = 0.9 + Math.random() * 1.1;
    activeParticleCount++;
    spawned++;
  }
}

function updateParticles(dtTicks) {
  for (let i = 0; i < particlePool.length; i++) {
    const p = particlePool[i];
    if (!p.active) continue;
    p.t += p.speed * dtTicks;
    if (p.t >= 1) {
      p.active = false;
      p.link = null;
      activeParticleCount--;
    }
  }
}

let drawParticles = function () {
  if (!sceneTuning.particlesEnabled) return;
  // Group by colour so fillStyle is set once per colour; per-particle alpha is
  // applied via globalAlpha.
  for (const arr of particleDrawGroups.values()) arr.length = 0;
  for (let i = 0; i < particlePool.length; i++) {
    const particle = particlePool[i];
    if (!particle.active) continue;
    const source = particle.link.source;
    const target = particle.link.target;
    if (!finiteNumber(source.__fx) || !finiteNumber(target.__fx)) continue;
    const x = source.__fx + (target.__fx - source.__fx) * particle.t;
    const y = source.__fy + (target.__fy - source.__fy) * particle.t;
    const color = sceneTuning.edgeColoringEnabled ? edgeColor(particle.link) : cfg.accent;
    const fade = particle.t < 0.1 ? particle.t / 0.1 : particle.t > 0.88 ? (1 - particle.t) / 0.12 : 1;
    let arr = particleDrawGroups.get(color);
    if (!arr) { arr = []; particleDrawGroups.set(color, arr); }
    arr.push(x, y, particle.size, particle.alpha * fade);
  }
  for (const [color, arr] of particleDrawGroups) {
    if (!arr.length) continue;
    ctx.fillStyle = color;
    for (let i = 0; i < arr.length; i += 4) {
      ctx.globalAlpha = Math.min(1, arr[i + 3]);
      ctx.beginPath();
      ctx.arc(arr[i], arr[i + 1], arr[i + 2], 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
};

// Ambient particles: slow dust drifting across the whole screen.
function initAmbientParticles() {
  ambientPool = [];
  if (!cfg.ambientParticles || REDUCED_MOTION) return;
  const count = Math.max(0, Math.min(300, cfg.ambientParticleCount | 0));
  for (let i = 0; i < count; i++) {
    ambientPool.push({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      vx: (Math.random() - 0.5) * cfg.ambientParticleSpeed,
      vy: (Math.random() - 0.5) * cfg.ambientParticleSpeed,
      phase: Math.random() * Math.PI * 2,
      size: cfg.ambientParticleSize * (0.6 + Math.random() * 0.8),
      alpha: 0.25 + Math.random() * 0.5
    });
  }
}

function updateAmbientParticles(dtTicks) {
  if (!ambientPool.length) return;
  const t = motionTime();
  const drift = sceneTuning.motion.driftAmp * 0.25;
  for (const p of ambientPool) {
    p.x += (p.vx * 0.6 + Math.cos(t * 0.004 + p.phase) * drift * 0.2) * dtTicks;
    p.y += (p.vy * 0.6 + Math.sin(t * 0.005 + p.phase) * drift * 0.2) * dtTicks;
    p.x = (p.x + innerWidth) % innerWidth;
    p.y = (p.y + innerHeight) % innerHeight;
  }
}

function drawAmbientParticles() {
  if (!ambientPool.length) return;
  ctx.fillStyle = mixHex(cfg.accent, themeIsDark() ? '#ffffff' : cfg.background, 0.4);
  for (const p of ambientPool) {
    ctx.globalAlpha = p.alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function buildClusterHalos() {
  if (sceneTuning.haloAlpha <= 0) return [];
  if (cachedHalos) return cachedHalos;
  const clusters = new Map();
  for (const node of nodes) {
    if (!node.tag || !finiteNumber(node.__bx)) continue;
    let cluster = clusters.get(node.tag);
    if (!cluster) {
      cluster = { color: nodeColor(node), count: 0, sumX: 0, sumY: 0, minX: node.__bx, maxX: node.__bx, minY: node.__by, maxY: node.__by };
      clusters.set(node.tag, cluster);
    }
    cluster.count += 1;
    cluster.sumX += node.__bx;
    cluster.sumY += node.__by;
    if (node.__bx < cluster.minX) cluster.minX = node.__bx;
    if (node.__bx > cluster.maxX) cluster.maxX = node.__bx;
    if (node.__by < cluster.minY) cluster.minY = node.__by;
    if (node.__by > cluster.maxY) cluster.maxY = node.__by;
  }
  cachedHalos = Array.from(clusters.values())
    .filter(cluster => cluster.count >= 3)
    .map(cluster => {
      const width = cluster.maxX - cluster.minX;
      const height = cluster.maxY - cluster.minY;
      const radius = Math.max(56, (Math.max(width, height) * 0.72 + Math.sqrt(cluster.count) * 22) * sceneTuning.haloRadiusBoost);
      return { color: cluster.color, x: cluster.sumX / cluster.count, y: cluster.sumY / cluster.count, radius };
    })
    .sort((a, b) => a.radius - b.radius);
  return cachedHalos;
}

function drawBackgroundGradient(g) {
  if (!sceneTuning.backgroundGradientEnabled) return;
  const [br, bgg, bb] = hexToRGB(cfg.background);
  const [ar, ag, ab] = hexToRGB(cfg.accent);
  const cx = innerWidth / 2;
  const cy = innerHeight / 2;
  const radius = Math.max(innerWidth, innerHeight) * 0.72;
  const gradient = g.createRadialGradient(cx, cy, 0, cx, cy, radius);
  gradient.addColorStop(0, rgba(mixChannel(br, ar, 0.15), mixChannel(bgg, ag, 0.15), mixChannel(bb, ab, 0.15), 1));
  gradient.addColorStop(0.5, rgba(br, bgg, bb, 1));
  gradient.addColorStop(1, rgba(Math.max(0, br - 5), Math.max(0, bgg - 5), Math.max(0, bb - 5), 1));
  g.fillStyle = gradient;
  g.fillRect(0, 0, innerWidth, innerHeight);
}

function drawClusterHalos(g) {
  for (const halo of buildClusterHalos()) {
    const [r, gg, b] = hexToRGB(halo.color);
    const gradient = g.createRadialGradient(halo.x, halo.y, 0, halo.x, halo.y, halo.radius);
    gradient.addColorStop(0, rgba(r, gg, b, sceneTuning.haloAlpha));
    gradient.addColorStop(0.55, rgba(r, gg, b, sceneTuning.haloAlpha * 0.28));
    gradient.addColorStop(1, rgba(r, gg, b, 0));
    g.fillStyle = gradient;
    g.beginPath();
    g.arc(halo.x, halo.y, halo.radius, 0, Math.PI * 2);
    g.fill();
  }
}

// Edge batches are reused when nothing moved (no drift, sim settled).
let edgeCacheKey = '';
let drawEdges = function () {
  const style = sceneTuning.edgeStyle || cfg.edgeStyle || 'line';
  if (style === 'none') return;
  const motionless = sceneTuning.motion.driftAmp === 0 || REDUCED_MOTION;
  const key = motionless && !simRunning ? `${graphEpoch}|${framingEpoch}|${tick > 0}|${renderScale}|${configStamp}` : '';
  if (!key || key !== edgeCacheKey) {
    edgeCacheKey = key;
    for (const byColor of edgeGroups.values()) for (const g of byColor.values()) g.segments.length = 0;
    const dof = sceneTuning.depthOfFieldEnabled;
    for (let i = 0; i < links.length; i += sceneTuning.linkStep) {
      const link = links[i];
      const s = link.source, t = link.target;
      if (s.__vFrame !== tick && t.__vFrame !== tick) continue;
      if (!s.__hasPoint || !t.__hasPoint) continue;
      const importance = Math.max(s.importance || 0, t.importance || 0);
      let alpha = cfg.linkOpacity * sceneTuning.linkOpacityScale * (0.3 + importance * 0.7);
      if (s.__dim && t.__dim) alpha *= 0.25;
      let lineWidth = 0.4 + importance * 0.6;
      if (dof) {
        const avgDist = (distFromCenterPoint(s.__fx, s.__fy) + distFromCenterPoint(t.__fx, t.__fy)) / 2;
        const m = 1 - avgDist * 0.5;
        alpha *= m;
        lineWidth *= m;
      }
      const color = edgeColor(link);
      const alphaBucket = Math.max(1, Math.min(8, Math.round(alpha * 8)));
      const widthIdx = lineWidth < 0.75 ? 0 : lineWidth < 1.1 ? 1 : 2;
      let byColor = edgeGroups.get(color);
      if (!byColor) { byColor = new Map(); edgeGroups.set(color, byColor); }
      const bucketIdx = (alphaBucket - 1) * 3 + widthIdx;
      let group = byColor.get(bucketIdx);
      if (!group) {
        group = { color, alpha: alphaBucket / 8, lineWidth: WIDTH_BUCKETS[widthIdx], segments: [] };
        byColor.set(bucketIdx, group);
      }
      group.segments.push(s.__fx, s.__fy, t.__fx, t.__fy);
    }
  }
  const isCurve = style === 'curve';
  for (const byColor of edgeGroups.values()) {
    for (const group of byColor.values()) {
      if (!group.segments.length) continue;
      ctx.strokeStyle = group.color;
      ctx.globalAlpha = Math.min(1, group.alpha);
      ctx.lineWidth = group.lineWidth;
      ctx.beginPath();
      const seg = group.segments;
      for (let i = 0; i < seg.length; i += 4) {
        const x1 = seg[i], y1 = seg[i + 1], x2 = seg[i + 2], y2 = seg[i + 3];
        ctx.moveTo(x1, y1);
        if (isCurve) {
          const dx = x2 - x1, dy = y2 - y1;
          const len = Math.sqrt(dx * dx + dy * dy) || 1;
          // Stable sign from endpoint coordinates so curves don't flip.
          const sign = ((x1 * 131 + y2 * 17) | 0) & 1 ? 1 : -1;
          const bow = Math.min(60, len * 0.22) * sign;
          ctx.quadraticCurveTo((x1 + x2) * 0.5 + (-dy / len) * bow, (y1 + y2) * 0.5 + (dx / len) * bow, x2, y2);
        } else {
          ctx.lineTo(x2, y2);
        }
      }
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
};

// Shapes for tagShapes: 0 circle, 1 square, 2 triangle, 3 diamond.
function addShapePath(g, shape, x, y, r) {
  if (shape === 1) { g.moveTo(x - r * 0.88, y - r * 0.88); g.rect(x - r * 0.88, y - r * 0.88, r * 1.76, r * 1.76); }
  else if (shape === 2) { g.moveTo(x, y - r * 1.15); g.lineTo(x + r, y + r * 0.7); g.lineTo(x - r, y + r * 0.7); g.closePath(); }
  else if (shape === 3) { g.moveTo(x, y - r * 1.2); g.lineTo(x + r * 1.2, y); g.lineTo(x, y + r * 1.2); g.lineTo(x - r * 1.2, y); g.closePath(); }
  else { g.moveTo(x + r, y); g.arc(x, y, r, 0, Math.PI * 2); }
}

// Per-colour node lists and alpha buckets are reused across frames (the old
// loop allocated an object per node per frame plus fresh Maps per colour).
const nodeGroups = new Map();
const BUCKETS = Array.from({ length: 9 }, () => []);
let drawNodes = function () {
  const glowIntensity = clamp(cfg.glowIntensity ?? 1, 0, 1);
  const glowEnabled = sceneTuning.glowEnabled && glowIntensity > 0;
  const dof = sceneTuning.depthOfFieldEnabled;
  const mt = motionTime();
  const pulseSpeed = sceneTuning.motion.pulseSpeed;
  for (const g of nodeGroups.values()) { g.low.length = 0; g.high.length = 0; }
  __drawnNodes = 0;

  for (let i = 0; i < nodes.length; i++) {
    const node = nodes[i];
    if (node.__vFrame !== tick || !node.__hasPoint) continue;
    __drawnNodes++;
    node.__pulse = Math.sin(mt * pulseSpeed + node.x * 0.004 + node.y * 0.003) * 0.5 + 0.5;
    let dofScale = 1, dofAlpha = 1;
    if (dof) {
      const distance = distFromCenterPoint(node.__fx, node.__fy);
      dofScale = 1 - distance * 0.3;
      dofAlpha = 1 - distance * 0.4;
    }
    node.__dofA = dofAlpha * (node.__depthAlpha || 1) * (node.__dim ? 0.22 : 1);
    node.__flare = node.ghost ? 0 : getFlareIntensity(node.id);
    node.__rad = node.r * dofScale * (node.__depthSize || 1);
    const color = nodeColor(node);
    let group = nodeGroups.get(color);
    if (!group) { group = { low: [], high: [] }; nodeGroups.set(color, group); }
    ((node.importance || 0) >= 0.3 || node.__flare > 0 ? group.high : group.low).push(node);
  }

  if (glowEnabled) {
    const chromatic = !!cfg.chromaticBloom && !REDUCED_MOTION;
    const breathPhase = (performance.now() / 30000) * Math.PI * 2;
    // On dark backgrounds glow is light: additive blending makes overlapping
    // hubs brighter instead of muddier.
    if (themeIsDark()) ctx.globalCompositeOperation = 'lighter';
    for (const [color, group] of nodeGroups) {
      if (!group.low.length && !group.high.length) continue;
      const sprite = getGlowSprite(color, chromatic, cfg.chromaticBloomIntensity);
      for (const list of [group.low, group.high]) {
        for (let i = 0; i < list.length; i++) {
          const node = list[i];
          if (node.ghost) continue;
          let glowRadius = (node.__rad + 3 + Math.sqrt(node.__rad)) * sceneTuning.glowScale * glowIntensity;
          // Breathing is wall-clock based so the ~30s cycle is the same at any fps.
          if (cfg.glowBreathing && !REDUCED_MOTION) {
            glowRadius *= 1 + Math.sin(breathPhase * cfg.glowBreathingSpeed + node.__breathOffset) * cfg.glowBreathingDepth;
          }
          if (!(glowRadius > 0)) continue;
          const glowAlpha = (0.08 + (node.importance || 0) * 0.15 + node.__pulse * 0.03 + node.__flare * 0.4) * node.__dofA * glowIntensity;
          if (glowAlpha <= 0) continue;
          ctx.globalAlpha = Math.min(1, glowAlpha);
          ctx.drawImage(sprite, node.__fx - glowRadius, node.__fy - glowRadius, glowRadius * 2, glowRadius * 2);
        }
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  const shapes = !!cfg.tagShapes;
  const drawCoreList = (list, cr, cg, cb, baseColor) => {
    for (const b of BUCKETS) b.length = 0;
    const hiBuckets = drawCoreList.hi;
    for (const b of hiBuckets) b.length = 0;
    for (let i = 0; i < list.length; i++) {
      const node = list[i];
      const ghostDim = node.ghost ? 0.35 : 1;
      const coreAlpha = Math.min(1, (0.55 + (node.importance || 0) * 0.35 + node.__pulse * 0.1 + node.__flare * 0.4) * node.__dofA * ghostDim);
      if (node.__flare > 0) {
        const f = node.__flare;
        ctx.fillStyle = rgba(Math.min(255, cr + Math.floor(f * 200)), Math.min(255, cg + Math.floor(f * 200)), Math.min(255, cb + Math.floor(f * 200)), coreAlpha);
        ctx.beginPath();
        addShapePath(ctx, shapes ? node.__shape : 0, node.__fx, node.__fy, node.__rad);
        ctx.fill();
        if (!node.ghost) {
          ctx.fillStyle = rgba(Math.min(255, cr + 80 + Math.floor(f * 175)), Math.min(255, cg + 80 + Math.floor(f * 175)), Math.min(255, cb + 80 + Math.floor(f * 175)), Math.min(1, (0.7 + node.__pulse * 0.3) * node.__dofA));
          ctx.beginPath();
          ctx.arc(node.__fx, node.__fy, node.__rad * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
        continue;
      }
      BUCKETS[Math.max(1, Math.min(8, Math.round(coreAlpha * 8)))].push(node);
      if (!node.ghost && (node.importance || 0) > 0.3) {
        hiBuckets[Math.max(1, Math.min(8, Math.round(Math.min(1, (0.7 + node.__pulse * 0.3) * node.__dofA) * 8)))].push(node);
      }
    }
    ctx.fillStyle = baseColor;
    for (let b = 1; b <= 8; b++) {
      const batch = BUCKETS[b];
      if (!batch.length) continue;
      ctx.globalAlpha = b / 8;
      ctx.beginPath();
      for (let i = 0; i < batch.length; i++) {
        const node = batch[i];
        addShapePath(ctx, shapes ? node.__shape : 0, node.__fx, node.__fy, node.__rad);
      }
      ctx.fill();
    }
    ctx.fillStyle = rgba(Math.min(255, cr + 80), Math.min(255, cg + 80), Math.min(255, cb + 80), 1);
    for (let b = 1; b <= 8; b++) {
      const batch = hiBuckets[b];
      if (!batch.length) continue;
      ctx.globalAlpha = b / 8;
      ctx.beginPath();
      for (let i = 0; i < batch.length; i++) {
        const node = batch[i];
        ctx.moveTo(node.__fx + node.__rad * 0.4, node.__fy);
        ctx.arc(node.__fx, node.__fy, node.__rad * 0.4, 0, Math.PI * 2);
      }
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  };
  drawCoreList.hi = drawNodes.__hi || (drawNodes.__hi = Array.from({ length: 9 }, () => []));

  for (const [color, group] of nodeGroups) {
    if (!group.low.length) continue;
    const [cr, cg, cb] = hexToRGB(color);
    drawCoreList(group.low, cr, cg, cb, color);
  }
  for (const [color, group] of nodeGroups) {
    if (!group.high.length) continue;
    const [cr, cg, cb] = hexToRGB(color);
    drawCoreList(group.high, cr, cg, cb, color);
  }
};

// Glow labels are pre-rendered sprites: shadowBlur per label per frame was
// one of the more expensive calls in the frame.
const labelSpriteCache = new Map();
function labelSprite(text, font, fontSize, glowColor, chromatic) {
  const key = text + '|' + font + '|' + glowColor + '|' + chromatic;
  let s = labelSpriteCache.get(key);
  if (s) return s;
  if (labelSpriteCache.size > 200) labelSpriteCache.clear();
  const pad = 10;
  const m = document.createElement('canvas').getContext('2d');
  m.font = font;
  const w = Math.ceil(m.measureText(text).width) + pad * 2;
  const h = Math.ceil(fontSize * 1.6) + pad * 2;
  const c = document.createElement('canvas');
  const scale = Math.min(2, DEVICE_DPR);
  c.width = w * scale; c.height = h * scale;
  const g = c.getContext('2d');
  g.scale(scale, scale);
  g.font = font;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = glowColor;
  g.shadowBlur = 6;
  if (chromatic) {
    g.fillStyle = 'rgba(255,100,200,0.7)'; g.fillText(text, w / 2 - 1, h / 2);
    g.fillStyle = 'rgba(100,255,255,0.7)'; g.fillText(text, w / 2 + 1, h / 2);
  }
  g.fillStyle = 'rgba(255,255,255,0.92)';
  g.fillText(text, w / 2, h / 2);
  s = { c, w, h };
  labelSpriteCache.set(key, s);
  return s;
}

let drawLabels = function () {
  if (!cfg.hubLabels || sceneTuning.labelCount <= 0) return;
  const placed = [];
  let drawn = 0;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const recentMode = cfg.labelSource === 'recent';
  const [br, bg, bb] = hexToRGB(cfg.background);
  const mode = (cfg.labelStyle && cfg.labelStyle.mode) || 'badge';
  const textColor = luminance(cfg.background) > 0.4 ? 'rgba(30,30,35,0.85)' : 'rgba(245,247,255,0.88)';
  const bgAlpha = cfg.labelStyle && finiteNumber(cfg.labelStyle.backgroundAlpha) ? cfg.labelStyle.backgroundAlpha : 0.72;

  for (let i = 0; i < labelCandidates.length; i++) {
    const node = labelCandidates[i];
    if (drawn >= sceneTuning.labelCount) break;
    if (!recentMode && (node.importance || 0) < sceneTuning.labelMinImportance) continue;
    if (node.__vFrame !== tick || !node.__hasPoint) continue;
    const dofAlpha = sceneTuning.depthOfFieldEnabled ? 1 - distFromCenterPoint(node.__fx, node.__fy) * 0.4 : 1;
    if (dofAlpha <= 0.12) continue;

    let label = node.__labelText;
    if (recentMode) label += '  ·  ' + SceneKit.ago(nodeDays(node));
    const fontSize = node.__labelFontSize;
    const font = `${fontSize}px ${labelFontStack()}`;
    ctx.font = font;
    const textWidth = recentMode ? ctx.measureText(label).width : node.__labelWidth || ctx.measureText(label).width;
    const x = node.__fx;
    const y = node.__fy + node.r + 16;
    const box = { x: x - textWidth / 2 - 8, y: y - fontSize / 2 - 5, w: textWidth + 16, h: fontSize + 10 };
    if (box.x < 10 || box.x + box.w > innerWidth - 10 || box.y < 10 || box.y + box.h > innerHeight - 10) continue;
    if (placed.some(o => !(box.x + box.w < o.x || o.x + o.w < box.x || box.y + box.h < o.y || o.y + o.h < box.y))) continue;

    const [cr, cg, cb] = hexToRGB(nodeColor(node));
    if (mode === 'badge') {
      roundedRectPath(box.x, box.y, box.w, box.h, 10);
      ctx.fillStyle = rgba(mixChannel(br, cr, 0.12), mixChannel(bg, cg, 0.12), mixChannel(bb, cb, 0.12), bgAlpha * dofAlpha);
      ctx.fill();
      ctx.strokeStyle = rgba(cr, cg, cb, 0.25 * dofAlpha);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = textColor;
      ctx.fillText(label, x, y + 0.5);
    } else if (mode === 'glow') {
      const glowColor = cfg.labelStyle.glowColor === 'node' ? nodeColor(node)
        : (cfg.labelStyle.glowColor && cfg.labelStyle.glowColor !== 'accent') ? cfg.labelStyle.glowColor : cfg.accent;
      const s = labelSprite(label, font, fontSize, glowColor, !!cfg.labelStyle.chromaticSplit);
      ctx.globalAlpha = dofAlpha;
      ctx.drawImage(s.c, x - s.w / 2, y + 0.5 - s.h / 2, s.w, s.h);
      ctx.globalAlpha = 1;
    } else if (mode === 'inherit') {
      roundedRectPath(box.x, box.y, box.w, box.h, 10);
      ctx.fillStyle = rgba(cr, cg, cb, 0.22 * dofAlpha);
      ctx.fill();
      ctx.fillStyle = textColor;
      ctx.fillText(label, x, y + 0.5);
    } else {
      ctx.fillStyle = textColor;
      ctx.fillText(label, x, y + 0.5);
    }
    placed.push(box);
    drawn += 1;
  }
};

// ---------------------------------------------------------------------------
// Scene object for scene themes (see themes/_scenekit.js)
// ---------------------------------------------------------------------------
let sceneDirty = true;
let sceneCache = null;
let configStamp = 0;
function rebuildScene() {
  sceneDirty = false;
  const list = [];
  for (const n of nodes) if (n.__renderable !== false) list.push(n);
  const index = new Map();
  const recencyDays = cfg.recencyDays || 7;
  const mode = cfg.nodeColorMode;
  const sn = list.map((n, i) => {
    index.set(n, i);
    const h = Math.abs(hashStr(n.id));
    const days = nodeDays(n);
    let ci = -1;
    if (!n.ghost) {
      if (mode === 'folder') ci = n.folder ? (folderRank.get(n.folder) || 0) : folderRank.size;
      else if (mode === 'age') ci = days < 2 ? 0 : days < 7 ? 1 : days < 30 ? 2 : days < 120 ? 3 : 4;
      else ci = n.tag ? (tagRank.get(n.tag) || 0) : tagRank.size;
    }
    return {
      i, id: n.id, src: n, x: 0, y: 0, bx: 0, by: 0, r: 0,
      ci,
      uc: (mode === 'tag' || mode === 'recency') && n.tag && cfg.tagColors[n.tag] ? cfg.tagColors[n.tag] : null,
      dim: !!n.__dim,
      ghost: !!n.ghost,
      imp: n.importance || 0,
      label: n.label || n.id,
      ph: (h % 6283) / 1000,
      h1: (h % 997) / 997,
      h2: ((h >> 8) % 991) / 991,
      days,
      deg: n.deg || 0,
      recent: !n.ghost && days < recencyDays,
      ti: n.tag ? (tagRank.get(n.tag) || 0) : -1,
      tag: n.tag || ''
    };
  });
  const sl = [];
  for (let i = 0; i < links.length; i++) {
    const a = index.get(links[i].source), b = index.get(links[i].target);
    if (a === undefined || b === undefined) continue;
    sl.push({ a: sn[a], b: sn[b], tree: false, intra: !!sn[a].tag && sn[a].tag === sn[b].tag, i: sl.length });
  }
  // A spanning tree per tag (BFS from its best-connected note): Metro draws
  // these as lines, Survey as footpaths.
  const adj = sn.map(() => []);
  sl.forEach((l, li) => { adj[l.a.i].push([l.b.i, li]); adj[l.b.i].push([l.a.i, li]); });
  const seen = new Uint8Array(sn.length);
  const byTag = new Map();
  for (const n of sn) if (n.tag && !n.ghost) { if (!byTag.has(n.tag)) byTag.set(n.tag, []); byTag.get(n.tag).push(n); }
  for (const group of byTag.values()) {
    group.sort((a, b) => b.deg - a.deg);
    for (const root of group) {
      if (seen[root.i]) continue;
      seen[root.i] = 1;
      const q = [root.i];
      for (let h = 0; h < q.length; h++) {
        for (const [v, li] of adj[q[h]]) {
          if (seen[v] || sn[v].tag !== root.tag) continue;
          seen[v] = 1; sl[li].tree = true; q.push(v);
        }
      }
    }
  }
  const real = sn.filter(n => !n.ghost);
  const hubs = real.slice().sort((a, b) => b.deg - a.deg).slice(0, 7);
  const recents = real.filter(n => n.recent).sort((a, b) => a.days - b.days).slice(0, 7);
  const bfsCache = new Map();
  const plainAdj = adj.map(a => a.map(x => x[0]));
  sceneCache = {
    nodes: sn, links: sl, hubs, recents, clusters: [],
    stats: vaultStats(),
    bfs(src) {
      let d = bfsCache.get(src);
      if (d) return d;
      if (bfsCache.size > 64) bfsCache.clear();
      d = new Int16Array(sn.length).fill(-1);
      d[src] = 0;
      const q = [src];
      for (let h = 0; h < q.length; h++) {
        const u = q[h];
        if (d[u] >= 5) continue;
        for (const v of plainAdj[u]) if (d[v] < 0) { d[v] = d[u] + 1; q.push(v); }
      }
      bfsCache.set(src, d);
      return d;
    }
  };
}

let __clusterKey = '';
function buildScene() {
  if (sceneDirty || !sceneCache) rebuildScene();
  const S = sceneCache;
  const W = innerWidth, H = innerHeight;
  const k = Math.max(0.5, W / 1280);
  for (const n of S.nodes) {
    const src = n.src;
    n.x = src.__fx; n.y = src.__fy; n.bx = src.__bx; n.by = src.__by;
    n.r = n.ghost ? 1.3 * k : (1.5 + Math.sqrt(n.deg) * 1.05) * 1.2 * k;
  }
  S.W = W; S.H = H; S.k = k;
  S.key = `${graphEpoch}|${framingEpoch}|${W}x${H}|${configStamp}`;
  if (S.key !== __clusterKey) {
    __clusterKey = S.key;
    const groups = new Map();
    for (const n of S.nodes) {
      if (n.ghost || n.ti < 0 || n.ti > 7 || !Number.isFinite(n.bx)) continue;
      let g = groups.get(n.ti);
      if (!g) { g = { ti: n.ti, name: n.tag, x: 0, y: 0, n: 0, list: [] }; groups.set(n.ti, g); }
      g.x += n.bx; g.y += n.by; g.n++; g.list.push(n);
    }
    S.clusters = Array.from(groups.values()).filter(g => g.n >= 3).map(g => {
      const x = g.x / g.n, y = g.y / g.n;
      let r = 0;
      for (const n of g.list) r += (n.bx - x) ** 2 + (n.by - y) ** 2;
      return { ti: g.ti, name: g.name, x, y, rad: Math.sqrt(r / g.n), n: g.n };
    }).sort((a, b) => a.ti - b.ti);
  }
  const sa = cfg.safeArea || {};
  S.ins = { t: sa.top || 0, r: sa.right || 0, b: sa.bottom || 0, l: sa.left || 0 };
  S.rect = framingRect;
  S.o = { labels: cfg.hubLabels ? cfg.labelSource : 'off', colorBy: cfg.nodeColorMode, overlay: cfg.overlay };
  S.pal = palette;
  S.cfg = cfg;
  return S;
}

if (PERF_ENABLED) {
  buildFramePoints = __perfWrap('buildFramePoints', buildFramePoints);
  drawEdges = __perfWrap('drawEdges', drawEdges);
  drawNodes = __perfWrap('drawNodes', drawNodes);
}

function drawGL() {
  const dark = themeIsDark();
  const glowIntensity = sceneTuning.glowEnabled ? clamp(cfg.glowIntensity ?? 1, 0, 1) : 0;
  __drawnNodes = glRenderer.draw({
    nodes, links,
    linkStep: sceneTuning.linkStep,
    visible: n => n.__vFrame === tick && n.__hasPoint,
    colorOf: n => nodeColor(n),
    edgeColorOf: l => edgeColor(l),
    edgeAlpha: Math.min(1, cfg.linkOpacity * sceneTuning.linkOpacityScale * 0.9),
    nodeAlpha: n => (n.ghost ? 0.35 : 0.85) * (n.__dim ? 0.22 : 1),
    nodeSize: n => (n.r * 2 + 2) * (glowIntensity > 0 ? 2.2 : 1.2),
    additive: dark,
    glow: glowIntensity * 0.6
  });
}

function draw() {
  const theme = activeTheme();
  tick += 1;
  prepareDof();
  buildFramePoints();

  if (theme && theme.kind === 'scene') {
    bgCanvas.style.display = 'none';
    glCanvas.style.display = 'none';
    const t0 = PERF_ENABLED ? performance.now() : 0;
    const S = buildScene();
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    theme.draw(ctx, S, REDUCED_MOTION ? 6 : performance.now() / 1000);
    if (!theme.labelsBuiltIn) SceneKit.labelPass(ctx, S, theme);
    ctx.restore();
    __drawnNodes = S.nodes.length;
    if (PERF_ENABLED) __perfRecord('drawScene', performance.now() - t0);
  } else {
    const hooks = theme && theme.kind === 'hooks' ? theme : null;
    const ownBackground = !!(hooks && hooks.drawBackground);
    bgCanvas.style.display = ownBackground ? 'none' : 'block';
    glCanvas.style.display = glActive ? 'block' : 'none';
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (ownBackground) hooks.drawBackground();
    else maybeRenderStaticLayer();
    if (glActive && !hooks) {
      drawGL();
      drawParticles();
      drawAmbientParticles();
    } else {
      if (hooks && hooks.drawEdges) hooks.drawEdges(); else drawEdges();
      if (hooks && hooks.drawParticles) hooks.drawParticles();
      else { drawAmbientParticles(); drawParticles(); }
      if (hooks && hooks.drawNodes) hooks.drawNodes(); else drawNodes();
    }
    if (hooks && hooks.drawLabels) hooks.drawLabels(); else drawLabels();
  }
  drawFadeOverlay();
  __hasRendered = true;
}

// ---------------------------------------------------------------------------
// Live updates
// ---------------------------------------------------------------------------
function stopStateSync() {
  if (eventSource) {
    eventSource.close();
    eventSource = null;
  }
  if (stateSyncTimer) {
    clearInterval(stateSyncTimer);
    stateSyncTimer = null;
  }
}

async function pollStateVersions() {
  const state = await loadJson('/api/state');
  if (!state) return;
  if (state.graphVersion && state.graphVersion > lastSeenGraphVersion) {
    lastSeenGraphVersion = state.graphVersion;
    await loadGraph();
  }
  if (state.configVersion && state.configVersion > lastSeenConfigVersion) {
    lastSeenConfigVersion = state.configVersion;
    await loadCfg();
  }
}

function startStateSync() {
  stopStateSync();
  if (SYNTHETIC_SIZE > 0 || ONESHOT) return;
  if ('EventSource' in window) {
    eventSource = new EventSource('/events');
    eventSource.addEventListener('hello', (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.graphVersion) lastSeenGraphVersion = data.graphVersion;
        if (data.configVersion) lastSeenConfigVersion = data.configVersion;
      } catch (err) {}
    });
    eventSource.addEventListener('graph', async (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.version) lastSeenGraphVersion = Math.max(lastSeenGraphVersion, data.version);
      } catch (err) {}
      await loadGraph();
    });
    eventSource.addEventListener('config', async (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.version) lastSeenConfigVersion = Math.max(lastSeenConfigVersion, data.version);
      } catch (err) {}
      configStamp++;
      await loadCfg();
    });
    eventSource.onerror = () => {
      if (!eventSource) return;
      stopStateSync();
      stateSyncTimer = setInterval(pollStateVersions, Math.max(1000, cfg.refreshMs));
    };
    return;
  }
  stateSyncTimer = setInterval(pollStateVersions, Math.max(1000, cfg.refreshMs));
}

// ---------------------------------------------------------------------------
// Frame loop
// ---------------------------------------------------------------------------
// The wallpaper runs all day, so idle cost matters more than peak fps.
//   - active (layout settling, flares, fades, recent config change): up to
//     maxFps (0 = "still": 30 fps only while something is changing)
//   - calm: idleFps; 0 holds the last frame and stops the loop entirely
//   - hidden: no frames; visibilitychange wakes it
function isSceneCalm() {
  if (simRunning || flares.size > 0 || __fadeActive || framingAnimating) return false;
  if (performance.now() - lastConfigChangeAt < 3000) return false;
  return true;
}

let loopScheduled = false;
let loopTimer = null;
let lastFrameAt = 0;
function wake() {
  if (loopScheduled || ONESHOT) return;
  if (SYNTHETIC_SIZE > 0 && !__bootDone) return;
  loopScheduled = true;
  if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
  requestAnimationFrame(frameLoop);
}

function targetFps() {
  const calm = isSceneCalm();
  const max = cfg.maxFps | 0;
  if (!calm) return max > 0 ? max : 30;
  if (max === 0) return 0;
  return Math.min(max, cfg.idleFps | 0);
}

function frameLoop(now) {
  loopScheduled = false;
  if (document.hidden && !EXPORT_MODE) return; // visibilitychange calls wake()
  const fps = targetFps();
  const dt = lastFrameAt ? Math.min(250, now - lastFrameAt) : 16.67;
  // rAF can run faster than the cap; skip frames that come too early.
  if (fps > 0 && fps < 58 && lastFrameAt && now - lastFrameAt < 1000 / fps - 2) {
    scheduleNext(fps, now);
    return;
  }
  lastFrameAt = now;
  const t0 = performance.now();
  spawnParticles(now);
  updateParticles(dt / 16.67);
  updateAmbientParticles(dt / 16.67);
  draw();
  if (PERF_ENABLED) { __perfRecord('frame', performance.now() - t0); __perfFrame(); }
  scheduleNext(targetFps(), now);
}

function scheduleNext(fps, now) {
  if (fps <= 0) return; // hold: nothing changes until wake()
  loopScheduled = true;
  if (fps >= 58) { requestAnimationFrame(frameLoop); return; }
  const delay = Math.max(0, 1000 / fps - (performance.now() - now) - 4);
  loopTimer = setTimeout(() => { loopTimer = null; requestAnimationFrame(frameLoop); }, delay);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { lastFrameAt = 0; markConfigChanged(); }
});

// Clock-driven changes: theme rotation and time-of-day tint/palette.
setInterval(() => {
  if (ONESHOT || SYNTHETIC_SIZE > 0) return;
  reapplyEffectiveConfig(false);
}, 30000);

// ---------------------------------------------------------------------------
// Export PNG (?export=1): composite every layer into one image
// ---------------------------------------------------------------------------
async function exportPng() {
  const deadline = performance.now() + 12000;
  while (simRunning && performance.now() < deadline) await new Promise(r => setTimeout(r, 200));
  await ensureTheme(cfg.theme);
  draw();
  const w = canvas.width, h = canvas.height;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const g = out.getContext('2d');
  g.fillStyle = cfg.background;
  g.fillRect(0, 0, w, h);
  if (bgCanvas.style.display !== 'none') g.drawImage(bgCanvas, 0, 0, w, h);
  if (glActive) g.drawImage(glCanvas, 0, 0, w, h);
  g.drawImage(canvas, 0, 0);
  const tint = cfg.timeOfDay === 'tint' ? timeOfDayTint(currentHour()) : null;
  if (tint) { g.globalCompositeOperation = tint.op; g.globalAlpha = tint.alpha; g.fillStyle = tint.color; g.fillRect(0, 0, w, h); }
  if (cfg.grain) { buildGrain(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = themeIsDark() ? 0.07 : 0.1; g.drawImage(grainEl, 0, 0, w, h); }
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  if (cfg.vignette) {
    const vg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.hypot(w, h) / 2);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, themeIsDark() ? 'rgba(0,0,0,0.55)' : 'rgba(60,48,36,0.22)');
    g.fillStyle = vg;
    g.fillRect(0, 0, w, h);
  }
  const toast = document.getElementById('toast');
  out.toBlob(blob => {
    if (!blob) { toast.textContent = 'Export failed'; toast.style.display = 'block'; return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vault-wallpaper-' + dayKey() + '.png';
    document.body.appendChild(a);
    a.click();
    toast.innerHTML = 'Saved ' + esc(a.download) + ' · <a href="' + url + '" download="' + esc(a.download) + '">download again</a>';
    toast.style.display = 'block';
    document.title = 'OLW exported';
  }, 'image/png');
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
let __bootDone = false;
resize();
applyBackground();

(async () => {
  await loadCfg();
  await loadGraph();
  await ensureTheme(cfg.theme);
  __bootDone = true;
  if (ONESHOT) {
    // Paint a few frames so pulse/flare are non-zero, then expose a
    // machine-readable result in the title for the renderer smoke test.
    for (let i = 0; i < 4; i++) draw();
    try { document.title = `OLW drawn=${__drawnNodes} nodes=${nodes.length} theme=${cfg.theme}`; } catch (e) {}
    return;
  }
  if (EXPORT_MODE) { startStateSync(); wake(); exportPng(); return; }
  startStateSync();
  wake();
})();

// ---------------------------------------------------------------------------
// Node search overlay (Ctrl/Cmd+K)
// ---------------------------------------------------------------------------
(function () {
  const wrap = document.getElementById('searchWrap');
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  let focusIdx = -1;
  let matches = [];
  const HEX_COLOR_RE = /^#[0-9a-fA-F]{6}$/;
  // Defense in depth: colours are interpolated into a style="" attribute.
  const safeColor = c => (HEX_COLOR_RE.test(c) ? c : '#7c5cff');

  function open() {
    wrap.classList.add('open');
    input.value = '';
    input.focus();
    results.innerHTML = '';
    focusIdx = -1;
  }
  function close() {
    wrap.classList.remove('open');
    results.innerHTML = '';
    focusIdx = -1;
  }
  function search(query) {
    if (!query || query.length < 2) { results.innerHTML = ''; focusIdx = -1; return; }
    const q = query.toLowerCase();
    matches = [];
    for (const n of nodes) {
      if (n.ghost && !cfg.showUnresolvedLinks) continue;
      if ((n.label || n.id || '').toLowerCase().includes(q)) matches.push(n);
      if (matches.length >= 30) break;
    }
    focusIdx = matches.length ? 0 : -1;
    results.innerHTML = matches.map((n, i) =>
      '<div class="search-result' + (i === 0 ? ' focus' : '') + '" data-idx="' + i + '">' +
      '<span class="tag-dot" style="background:' + safeColor(nodeColor(n)) + '"></span>' +
      '<span class="label">' + esc(n.label || n.id) + '</span>' +
      (n.ghost ? '<span class="ghost-tag">unresolved</span>' : '') +
      '</div>'
    ).join('');
  }
  function selectResult(idx) {
    if (idx < 0 || idx >= matches.length) return;
    flares.set(matches[idx].id, { start: performance.now(), duration: 2000 });
    close();
    wake();
  }
  function updateFocus() {
    const items = results.querySelectorAll('.search-result');
    items.forEach((el, i) => el.classList.toggle('focus', i === focusIdx));
    if (items[focusIdx]) items[focusIdx].scrollIntoView({ block: 'nearest' });
  }
  document.addEventListener('keydown', e => {
    if (PREVIEW_MODE) return;
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && e.key === 'k') { e.preventDefault(); open(); return; }
    if (e.key === 'Escape' && wrap.classList.contains('open')) { close(); return; }
    if (!wrap.classList.contains('open')) return;
    const max = matches.length;
    if (e.key === 'ArrowDown' && max) { e.preventDefault(); focusIdx = (focusIdx + 1) % max; updateFocus(); }
    else if (e.key === 'ArrowUp' && max) { e.preventDefault(); focusIdx = (focusIdx - 1 + max) % max; updateFocus(); }
    else if (e.key === 'Enter' && focusIdx >= 0) { e.preventDefault(); selectResult(focusIdx); }
  });
  input.addEventListener('input', () => search(input.value));
  results.addEventListener('click', e => {
    const el = e.target.closest('.search-result');
    if (el) selectResult(parseInt(el.dataset.idx, 10));
  });
})();
