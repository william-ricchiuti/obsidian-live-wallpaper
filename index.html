<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Defense in depth: everything here is same-origin already (server binds
     127.0.0.1 only, D3 is vendored locally), so this mainly forecloses any
     future accidental third-party script/image/connect src. script-src and
     style-src need 'unsafe-inline' because the renderer's logic and dynamic
     styling live inline. blob: is allowed for img so "Export PNG" can hand the
     browser a download link. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<style>
  html,body{margin:0;height:100%;overflow:hidden;}
  body{--sa:#7c5cff;--sbg:rgba(14,14,20,0.92);--sfg:#e0e0e8;--ofg:#e8e8f0;}
  /* Layer stack. Post effects (tint, grain, vignette) and the overlay widget
     are separate compositor layers with CSS blend modes, so they cost nothing
     per frame — the canvases never redraw for them. */
  .layer{position:fixed;inset:0;pointer-events:none;display:block}
  #bg{z-index:0} #gl{z-index:1;display:none} #c{z-index:2}
  #tint{z-index:3;display:none}
  #grain{z-index:4;mix-blend-mode:overlay;display:none}
  #vignette{z-index:5;display:none}
  #overlay{position:fixed;z-index:6;pointer-events:none;color:var(--ofg);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;display:none;max-width:min(440px,60vw)}
  #overlay .clock{font-weight:200;font-size:clamp(40px,6.2vw,96px);line-height:1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
  #overlay .date{font-size:clamp(12px,1.1vw,17px);opacity:.72;margin-top:8px;font-weight:500}
  #overlay .stats{display:flex;gap:clamp(18px,2.6vw,40px)}
  #overlay .stat b{display:block;font-size:clamp(20px,2.4vw,34px);font-weight:500;font-variant-numeric:tabular-nums}
  #overlay .stat span{font:clamp(9px,.8vw,12px)/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
  #overlay .note{border-radius:12px;padding:16px 20px;background:var(--ocard);border:1px solid var(--oline);backdrop-filter:blur(10px)}
  #overlay .note small{display:block;font:clamp(9px,.75vw,11px)/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-bottom:6px}
  #overlay .note b{display:block;font-size:clamp(14px,1.2vw,18px);font-weight:600;margin-bottom:6px}
  #overlay .note p{margin:0;font-size:clamp(12px,1vw,15px);line-height:1.5;opacity:.8}
  .search-wrap{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:10;display:none;width:360px;max-width:90vw}
  .search-wrap.open{display:block}
  .search-input{box-sizing:border-box;width:100%;padding:10px 14px;font-size:15px;background:var(--sbg);border:1px solid color-mix(in srgb,var(--sa) 50%,transparent);border-radius:8px;color:var(--sfg);outline:none;font-family:inherit;backdrop-filter:blur(12px)}
  .search-input:focus{border-color:var(--sa)}
  .search-results{max-height:320px;overflow-y:auto;margin-top:6px;background:var(--sbg);border:1px solid color-mix(in srgb,var(--sa) 30%,transparent);border-radius:8px;color:var(--sfg);backdrop-filter:blur(12px);display:none}
  .search-results:not(:empty){display:block}
  .search-result{padding:8px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .search-result:hover,.search-result.focus{background:color-mix(in srgb,var(--sa) 20%,transparent)}
  .search-result .tag-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .search-result .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .search-result .ghost-tag{font-size:10px;opacity:.6;margin-left:auto;flex-shrink:0}
  .toast{position:fixed;bottom:18px;right:18px;z-index:11;font:13px -apple-system,BlinkMacSystemFont,sans-serif;background:rgba(10,10,14,.85);color:#eee;padding:10px 14px;border-radius:8px;display:none}
  .toast a{color:#b9a8ff}
</style></head><body>
<canvas id="bg" class="layer"></canvas>
<canvas id="gl" class="layer"></canvas>
<canvas id="c" class="layer"></canvas>
<div id="tint" class="layer"></div>
<canvas id="grain" class="layer"></canvas>
<div id="vignette" class="layer"></div>
<div id="overlay" aria-live="polite"></div>
<div class="search-wrap" id="searchWrap">
  <input type="text" class="search-input" id="searchInput" placeholder="Search nodes… (Ctrl+K)" autocomplete="off" aria-label="Search notes">
  <div class="search-results" id="searchResults"></div>
</div>
<div class="toast" id="toast"></div>
<script src="/vendor/d3.min.js"></script>
<script src="/renderer-core.js"></script>
<script src="/layout-core.js"></script>
<script src="/gl-renderer.js"></script>
<script src="/themes/registry.js"></script>
<script src="/themes/_scenekit.js"></script>
<script>
const canvas = document.getElementById('c');
// The main canvas is transparent: for the default theme the background and
// cluster halos live on #bg underneath and only redraw when they change.
const ctx = canvas.getContext('2d', { alpha: true });
const bgCanvas = document.getElementById('bg');
const bgCtx = bgCanvas.getContext('2d', { alpha: false });
const glCanvas = document.getElementById('gl');
const DEVICE_DPR = window.devicePixelRatio || 1;
let renderScale = DEVICE_DPR;

// DEFAULTS is fetched from /api/defaults; this copy is the fallback for offline
// and synthetic mode. scripts/smoke.js asserts it matches parser.js DEFAULTS.
const DEFAULTS = {
  accent: '#7c5cff',
  background: '#0a0a0f',
  refreshMs: 5000,
  linkOpacity: 0.18,
  nodeGlow: true,
  particles: true,
  particleSpeed: 1,
  particleDensity: 0.3,
  motionMode: 'balanced',
  clusterByTag: true,
  clusterHalos: true,
  backgroundGradient: true,
  hubLabels: false,
  hubLabelCount: 5,
  labelMinImportance: 0.22,
  edgeColoring: true,
  depthOfField: true,
  noteFlare: true,
  autoScaleLargeVaults: true,
  showUnresolvedLinks: true,
  fastHash: true,
  glowIntensity: 1,
  edgeStyle: 'line',
  nodeColorMode: 'tag',
  labelFont: 'sans',
  autoTheme: false,
  lightAccent: '#39407a',
  lightBackground: '#ece6d6',
  maxRenderedNodes: 5000,
  ignorePaths: [],
  tagColors: {},
  glowBreathing: true,
  glowBreathingSpeed: 1,
  glowBreathingDepth: 0.15,
  ambientParticles: false,
  ambientParticleCount: 40,
  ambientParticleSpeed: 0.3,
  ambientParticleSize: 1.5,
  chromaticBloom: true,
  chromaticBloomIntensity: 0.4,
  depthParallax: true,
  depthParallaxStrength: 0.5,
  depthParallaxLayers: 3,
  theme: 'default',
  labelStyle: {},
  layout: 'force',
  framing: 'center',
  zoom: 1,
  offsetX: 0,
  offsetY: 0,
  safeArea: { top: 0, right: 0, bottom: 0, left: 0 },
  palette: 'auto',
  recencyDays: 7,
  timeOfDay: 'off',
  tagShapes: false,
  grain: true,
  vignette: false,
  overlay: 'none',
  labelSource: 'hubs',
  focusNote: '',
  focusHops: 2,
  rotate: { themes: [], everyMinutes: 60 },
  maxFps: 30,
  idleFps: 10,
  renderer: 'auto'
};

const ENUMS = {
  motionMode: ['still', 'light', 'balanced', 'showcase'],
  edgeStyle: ['line', 'curve', 'none'],
  nodeColorMode: ['tag', 'age', 'folder', 'recency'],
  labelFont: ['sans', 'mono', 'serif'],
  layout: ['force', 'rings', 'timeline', 'galaxy'],
  framing: ['center', 'fill', 'left', 'right', 'none'],
  palette: ['auto', 'aurora', 'riso', 'metro', 'pastel', 'earth', 'neon', 'viridis', 'mono'],
  timeOfDay: ['off', 'tint', 'palette'],
  overlay: ['none', 'clock', 'stats', 'note'],
  labelSource: ['hubs', 'recent'],
  renderer: ['auto', 'canvas', 'webgl']
};
const FONT_STACKS = {
  sans: "-apple-system, BlinkMacSystemFont, 'Inter', sans-serif",
  mono: "ui-monospace, SFMono-Regular, Menlo, 'Cascadia Code', monospace",
  serif: "Georgia, 'Iowan Old Style', 'Times New Roman', serif"
};
// labelFont is the font control. (labelStyle.fontStyle used to override it,
// which made the settings dropdown do nothing after any preset was applied.)
function labelFontStack() { return FONT_STACKS[cfg.labelFont] || FONT_STACKS.sans; }
// Deterministic per-folder colour for nodeColorMode 'folder' without a palette.
const FOLDER_COLOR_CACHE = new Map();
function folderColor(folder) {
  if (!folder) return cfg.accent;
  let c = FOLDER_COLOR_CACHE.get(folder);
  if (c) return c;
  const hue = ((hashStr(folder) % 360) + 360) % 360;
  c = hslToHex(hue, 60, 64);
  FOLDER_COLOR_CACHE.set(folder, c);
  return c;
}
// Age palette: fresh (green) → stale (red)
const AGE_PALETTE = ['#78d97c', '#b8d960', '#e8c84a', '#e89a3c', '#d96b4a'];

const MOTION_PROFILES = {
  still: { driftAmp: 0.15, phaseSpeed: 0.004, pulseSpeed: 0.006, particleSpawnEvery: 8, particleBurst: 2, particleAlpha: 0.6 },
  light: { driftAmp: 0.4, phaseSpeed: 0.008, pulseSpeed: 0.012, particleSpawnEvery: 6, particleBurst: 3, particleAlpha: 0.78 },
  balanced: { driftAmp: 0.75, phaseSpeed: 0.013, pulseSpeed: 0.017, particleSpawnEvery: 4, particleBurst: 5, particleAlpha: 0.92 },
  showcase: { driftAmp: 1.2, phaseSpeed: 0.018, pulseSpeed: 0.024, particleSpawnEvery: 2, particleBurst: 8, particleAlpha: 1 }
};

const MAX_PARTICLES = 600;
const WIDTH_BUCKETS = [0.6, 0.95, 1.3];

let cfg = { ...DEFAULTS };
let __rawCfg = { ...DEFAULTS };
let nodes = [];
let links = [];
let maxDeg = 1;
let tick = 0; // frame counter (hook themes compare __vFrame against it)
let particlePool = [];
let simRunning = false;
let simAlpha = 0;
let simWorker = null;
let simGeneration = 0;
let simSharedPositions = null;
let simSharedEnabled = false;
let lastConfigChangeAt = performance.now();
let eventSource = null;
let stateSyncTimer = null;
let lastSeenGraphVersion = 0;
let lastSeenConfigVersion = 0;
let labelCandidates = [];
const RGB_CACHE = new Map();
const edgeGroups = new Map();
const particleDrawGroups = new Map();
let activeParticleCount = 0;
let __drawnNodes = 0; // nodes drawn last frame (read by the renderer smoke probe)
let __cullFrame = -1;
let __rankedIdx = null;
let __rankValid = false;
let __hasRendered = false;
let __fadeCanvas = null, __fadeStart = 0, __fadeActive = false;
const FADE_MS = 240;
let cachedHalos = null;
let staticLayerDirty = true;
let staticLayerLastBuild = 0;
let topologyHash = '';
let graphEpoch = 0;
let lastGraphEtag = '';
let tagRank = new Map();
let folderRank = new Map();
let palette = null;
let focusSet = null;
let ambientPool = [];
function markConfigChanged() { lastConfigChangeAt = performance.now(); wake(); }

// Time used for motion phases, in "60fps ticks". Wall-clock based so drift,
// pulses and particles move at the same speed whether the loop runs at 60,
// 30 or 10 fps. Reduced motion freezes it.
let REDUCED_MOTION = false;
function motionTime() { return REDUCED_MOTION ? 0 : performance.now() / 16.6667; }

const QUERY_PARAMS = (() => {
  try { return new URLSearchParams(location.search); }
  catch (e) { return new URLSearchParams(); }
})();
const PERF_ENABLED = QUERY_PARAMS.get('perf') === '1';
const ONESHOT = QUERY_PARAMS.get('oneshot') === '1';
const EXPORT_MODE = QUERY_PARAMS.get('export') === '1';
const PREVIEW_MODE = QUERY_PARAMS.get('preview') === '1';
const HOUR_OVERRIDE = (() => {
  const h = parseFloat(QUERY_PARAMS.get('hour') || '');
  return Number.isFinite(h) && h >= 0 && h < 24 ? h : null;
})();
// Multi-monitor span: ?span=2of3 renders the 2nd of 3 side-by-side screens of
// one shared layout. Each host page gets its own slice of the same graph.
const SPAN = (() => {
  const m = /^(\d+)of(\d+)$/.exec(QUERY_PARAMS.get('span') || '');
  if (!m) return { index: 0, count: 1 };
  const count = Math.max(1, Math.min(8, parseInt(m[2], 10)));
  return { index: Math.max(0, Math.min(count - 1, parseInt(m[1], 10) - 1)), count };
})();
const SYNTHETIC_SIZE = (() => {
  const n = parseInt(QUERY_PARAMS.get('synthetic') || '', 10);
  return Number.isFinite(n) && n > 0 ? Math.min(200000, n) : 0;
})();
const SYNTHETIC_CFG = (() => {
  const raw = QUERY_PARAMS.get('cfgjson');
  if (!raw) return null;
  try { return JSON.parse(decodeURIComponent(raw)); }
  catch (e) { console.warn('cfgjson parse failed', e.message); return null; }
})();

try {
  const __rmq = window.matchMedia('(prefers-reduced-motion: reduce)');
  REDUCED_MOTION = __rmq.matches;
  const __onRM = () => {
    REDUCED_MOTION = __rmq.matches;
    refreshSceneTuning();
    markConfigChanged();
  };
  if (__rmq.addEventListener) __rmq.addEventListener('change', __onRM);
  else if (__rmq.addListener) __rmq.addListener(__onRM);
} catch (e) {}

let PREFERS_LIGHT = false;
try {
  const __lq = window.matchMedia('(prefers-color-scheme: light)');
  PREFERS_LIGHT = __lq.matches;
  const __onL = () => { PREFERS_LIGHT = __lq.matches; reapplyEffectiveConfig(true); };
  if (__lq.addEventListener) __lq.addEventListener('change', __onL);
  else if (__lq.addListener) __lq.addListener(__onL);
} catch (e) {}

let sceneTuning = buildSceneTuning();

// ---------------------------------------------------------------------------
// Synthetic graphs (screenshots and the renderer smoke test)
// ---------------------------------------------------------------------------
// A realistic vault: tags with hub notes, power-law links, journals, orphans,
// unresolved links and edit times. Small enough graphs are settled with the
// real layout code, so previews look like an actual vault, not a spiral.
function buildSyntheticGraph(size) {
  let seed = 20261013;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const TAGS = ['project', 'journal', 'research', 'idea', 'people', 'reading', 'meeting', 'reference'];
  const WEIGHTS = [0.16, 0.24, 0.14, 0.1, 0.06, 0.08, 0.11, 0.08];
  const FOLDERS = ['Projects', 'Daily', 'Research', 'Ideas', 'People', 'Library', 'Meetings', 'Reference'];
  const now = Date.now();
  const nodesOut = [];
  const linksOut = [];
  const seen = new Set();
  const pools = TAGS.map(() => []);
  const addLink = (a, b) => {
    if (a === b) return;
    const key = a < b ? a + '|' + b : b + '|' + a;
    if (seen.has(key)) return;
    seen.add(key);
    linksOut.push({ source: a, target: b });
  };
  const ghosts = Math.max(1, Math.round(size * 0.07));
  const real = size - ghosts;
  TAGS.forEach((t, ti) => {
    const id = t[0].toUpperCase() + t.slice(1) + ' MOC';
    nodesOut.push({ id, tag: t, folder: FOLDERS[ti], mtime: now - rnd() * 20 * 86400000 });
    pools[ti].push(id, id);
  });
  let journal = 0;
  for (let i = nodesOut.length; i < real; i++) {
    let r = rnd(), ti = 0;
    for (; ti < WEIGHTS.length - 1 && r > WEIGHTS[ti]; ti++) r -= WEIGHTS[ti];
    const tag = TAGS[ti];
    const days = tag === 'journal' ? (journal++) * 1.1 : -Math.log(1 - rnd() * 0.995) * 70;
    const id = tag === 'journal' ? new Date(now - days * 86400000).toISOString().slice(0, 10) + (journal > 300 ? '-' + i : '') : tag + '-' + i;
    nodesOut.push({ id, tag, folder: rnd() < 0.1 ? 'Inbox' : FOLDERS[ti], mtime: now - days * 86400000 });
    if (rnd() < 0.025) continue; // orphan
    if (rnd() < (tag === 'journal' ? 0.18 : 0.55)) { addLink(id, pools[ti][0]); pools[ti].push(pools[ti][0]); }
    const k = 1 + Math.floor(rnd() * 2.4);
    for (let j = 0; j < k; j++) {
      const target = pools[ti][Math.floor(rnd() * pools[ti].length)];
      addLink(id, target);
      pools[ti].push(target, id);
    }
    const cross = tag === 'journal' ? 2 : (rnd() < 0.45 ? 1 : 0);
    for (let j = 0; j < cross; j++) {
      const ct = Math.floor(rnd() * TAGS.length);
      if (ct === ti) continue;
      const target = pools[ct][Math.floor(rnd() * pools[ct].length)];
      if (target) { addLink(id, target); pools[ct].push(target); }
    }
  }
  for (let j = 0; j < 6; j++) nodesOut[8 + Math.floor(rnd() * (real - 9))].mtime = now - rnd() * 1.5 * 86400000;
  for (let g = 0; g < ghosts; g++) {
    const id = 'Unresolved ' + g;
    nodesOut.push({ id, ghost: true });
    const c = 1 + Math.floor(rnd() * 2.5);
    for (let j = 0; j < c; j++) addLink(nodesOut[Math.floor(rnd() * real)].id, id);
  }
  return { nodes: nodesOut, links: linksOut };
}

// ---------------------------------------------------------------------------
// Perf HUD (?perf=1)
// ---------------------------------------------------------------------------
let __perfRecord = null;
let __perfFrame = null;
let __perfWrap = (name, fn) => fn;
if (PERF_ENABLED) {
  const SECTIONS = ['buildFramePoints', 'drawEdges', 'drawNodes', 'drawScene', 'frame'];
  const buckets = {};
  SECTIONS.forEach(s => { buckets[s] = { sum: 0, count: 0, avgMs: 0 }; });
  let frameCount = 0;
  let windowStart = performance.now();
  const snapshot = { fps: 0, sections: buckets, nodes: 0, links: 0, particles: 0, alpha: 0, calm: false };
  window.__perf = snapshot;
  __perfRecord = (name, ms) => { const b = buckets[name]; if (b) { b.sum += ms; b.count += 1; } };
  __perfFrame = () => {
    frameCount += 1;
    const now = performance.now();
    const elapsed = now - windowStart;
    if (elapsed >= 1000) {
      snapshot.fps = Math.round((frameCount * 1000) / elapsed);
      for (const s of SECTIONS) { const b = buckets[s]; b.avgMs = b.count ? b.sum / b.count : 0; b.sum = 0; b.count = 0; }
      snapshot.nodes = nodes.length;
      snapshot.links = links.length;
      snapshot.particles = activeParticleCount;
      snapshot.alpha = simAlpha;
      snapshot.calm = isSceneCalm();
      frameCount = 0;
      windowStart = now;
    }
  };
  __perfWrap = (name, fn) => function () {
    const t = performance.now();
    const r = fn.apply(this, arguments);
    __perfRecord(name, performance.now() - t);
    return r;
  };
  const hud = document.createElement('div');
  hud.style.cssText = 'position:fixed;top:8px;left:8px;z-index:99999;font:11px/1.35 ui-monospace,Menlo,monospace;color:#b8f0ff;background:rgba(8,12,20,0.72);padding:8px 10px;border:1px solid rgba(120,180,220,0.25);border-radius:6px;pointer-events:none;white-space:pre;';
  hud.textContent = 'perf…';
  document.body.appendChild(hud);
  const fmt = (n) => n.toFixed(2).padStart(6);
  setInterval(() => {
    hud.textContent =
      'FPS ' + String(snapshot.fps).padStart(3) + (snapshot.calm ? '  (idle)' : '') + '\n' +
      'theme    ' + cfg.theme + (glActive ? ' [webgl]' : '') + '\n' +
      'nodes    ' + snapshot.nodes + '\n' +
      'links    ' + snapshot.links + '\n' +
      'particles ' + snapshot.particles + '\n' +
      'alpha    ' + snapshot.alpha.toFixed(4) + '\n' +
      'build    ' + fmt(buckets.buildFramePoints.avgMs) + ' ms\n' +
      'edges    ' + fmt(buckets.drawEdges.avgMs) + ' ms\n' +
      'nodesDr  ' + fmt(buckets.drawNodes.avgMs) + ' ms\n' +
      'scene    ' + fmt(buckets.drawScene.avgMs) + ' ms\n' +
      'frame    ' + fmt(buckets.frame.avgMs) + ' ms';
  }, 500);
}

function finiteNumber(value) {
  return typeof value === 'number' && Number.isFinite(value);
}

function hasPoint(node) {
  return finiteNumber(node?.x) && finiteNumber(node?.y);
}

function isPlainObject(value) {
  return value !== null && typeof value === 'object' && !Array.isArray(value);
}

// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
function normalizeConfig(data) {
  const next = { ...DEFAULTS, ...(isPlainObject(data) ? data : {}) };
  for (const [key, allowed] of Object.entries(ENUMS)) {
    if (!allowed.includes(next[key])) next[key] = DEFAULTS[key];
  }
  next.tagColors = isPlainObject(next.tagColors) ? next.tagColors : {};
  next.labelStyle = isPlainObject(next.labelStyle) ? next.labelStyle : {};
  next.safeArea = isPlainObject(next.safeArea) ? { ...DEFAULTS.safeArea, ...next.safeArea } : { ...DEFAULTS.safeArea };
  next.rotate = isPlainObject(next.rotate) && Array.isArray(next.rotate.themes) ? next.rotate : { ...DEFAULTS.rotate };
  next.glowIntensity = finiteNumber(next.glowIntensity) ? clamp(next.glowIntensity, 0, 1) : DEFAULTS.glowIntensity;
  next.maxRenderedNodes = finiteNumber(next.maxRenderedNodes)
    ? Math.max(100, Math.min(100000, Math.floor(next.maxRenderedNodes)))
    : DEFAULTS.maxRenderedNodes;
  for (const key of ['zoom', 'offsetX', 'offsetY', 'recencyDays', 'focusHops', 'maxFps', 'idleFps']) {
    if (!finiteNumber(next[key])) next[key] = DEFAULTS[key];
  }
  next.autoTheme = next.autoTheme === true;
  next.focusNote = typeof next.focusNote === 'string' ? next.focusNote : '';
  if (typeof next.theme !== 'string' || !/^[a-z0-9-]+$/.test(next.theme)) next.theme = 'default';
  return next;
}

function currentHour() {
  if (HOUR_OVERRIDE !== null) return HOUR_OVERRIDE;
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60;
}

// Rotation: cycle through rotate.themes every rotate.everyMinutes.
function rotatedTheme(c) {
  const list = c.rotate && Array.isArray(c.rotate.themes) ? c.rotate.themes : [];
  if (!list.length) return c.theme;
  const every = Math.max(1, c.rotate.everyMinutes || 60) * 60000;
  return list[Math.floor(Date.now() / every) % list.length];
}

// Raw config → what the renderer actually uses: light colours (OS light mode or
// daytime), the active rotated theme, and a contrast floor on the accent.
function computeEffectiveConfig(raw) {
  let c = { ...raw };
  const useLight = (c.autoTheme && PREFERS_LIGHT) || (c.timeOfDay === 'palette' && isDaytime(currentHour()));
  if (useLight) c = { ...c, accent: c.lightAccent || c.accent, background: c.lightBackground || c.background, nodeGlow: false };
  c.theme = rotatedTheme(c);
  c.accent = ensureContrast(c.accent, c.background, 1.8);
  return c;
}

function reapplyEffectiveConfig(fade) {
  const next = computeEffectiveConfig(__rawCfg);
  const changed = next.theme !== cfg.theme || next.accent !== cfg.accent || next.background !== cfg.background;
  if (!changed && !fade) { applyPostLayers(); return; }
  if (changed && __hasRendered) snapshotForFade();
  cfg = next;
